<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f7f6" />
    <meta name="description" content="Find Sydney coastal volunteer events by date, location and activity." />
    <title>Find an event — Driftline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body data-page="search">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner content-shell">
        <a class="brand" href="/" aria-label="Driftline home">driftline<span>.</span></a>
        <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">Menu</button>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/search.html" aria-current="page">Events</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <section class="page-heading content-shell">
        <p class="eyebrow">COASTAL VOLUNTEER EVENTS / SYDNEY</p>
        <h1>Find an event</h1>
        <p>Choose a date, suburb or activity. You can use more than one filter.</p>
      </section>
      <section class="search-layout content-shell" aria-label="Search events">
        <aside class="filter-panel">
          <div class="filter-heading">
            <h2>Filters</h2>
            <button class="clear-button" id="clear-filters" type="button">Clear all</button>
          </div>
          <form id="filter-form">
            <label for="filter-date">Date</label>
            <input id="filter-date" name="date" type="date" />
            <label for="filter-location">Location</label>
            <input id="filter-location" name="location" type="search" placeholder="e.g. Bondi" maxlength="80" />
            <label for="filter-category">Activity</label>
            <select id="filter-category" name="category"><option value="">All activities</option></select>
            <button class="primary-button filter-submit" type="submit">Apply filters <span aria-hidden="true">→</span></button>
          </form>
        </aside>
        <div class="results-panel">
          <div class="results-heading">
            <h2>Upcoming events</h2>
            <span class="results-count" id="results-count" aria-live="polite">— events</span>
          </div>
          <div id="search-results" class="event-list" aria-live="polite"><p class="status-message">Loading events…</p></div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-inner content-shell">
        <a class="brand" href="/">driftline<span>.</span></a>
        <span>Sydney, NSW</span>
        <nav aria-label="Footer navigation"><a href="/">Home</a><a href="/search.html">Events</a></nav>
      </div>
    </footer>
  </body>
</html>
